<head>

<title>Collage de portadas — Coleccionista de Infinitos</title>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#050409;}
.grid{display:grid;grid-template-columns:repeat(16, 1fr);gap:1px;background:#050409;}
.tile{position:relative;aspect-ratio:1/1;overflow:hidden;background:linear-gradient(135deg,#1a1430,#241a38);}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s;}
.tile img.loaded{opacity:1;}
.tile .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:600 8px/1.2 sans-serif;color:#cfc9ea;text-align:center;padding:4px;background:linear-gradient(135deg,#b05eff,#2ff0d8);opacity:.5;}
.bar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;background:rgba(5,4,9,.85);backdrop-filter:blur(8px);font:600 13px "Inter",sans-serif;color:#eeeaf7;}
.bar .dl{background:linear-gradient(95deg,#2ff0d8,#38b8ff);color:#07060d;border:none;padding:9px 16px;border-radius:999px;cursor:pointer;font:600 13px "Inter",sans-serif;}
.bar .dl:disabled{opacity:.4;cursor:default;}
.bar .hint{color:#8d87ab;font-weight:500;font-size:12px;}
.spacer{height:52px;}
</style>
</head>
<body>
<div class="bar">
  <span id="statusTxt">Preparando…</span>
  <span style="display:flex;align-items:center;gap:10px">
    <span class="hint" id="hintTxt">Si el botón no descarga, toma una captura de pantalla de la cuadrícula.</span>
    <button class="dl" id="dlBtn" disabled>Descargar PNG</button>
  </span>
</div>
<div class="spacer"></div>
<div class="grid" id="grid"></div>

bra"},{"artist":"Eddie Palmieri","title":"Vamonos Pal Monte"},{"artist":"Kraftwerk","title":"Trans-Europe Express"},{"artist":"Marvin Gaye","title":"What's Going On"},{"artist":"El Último de la Fila","title":"Enemigos de lo ajeno"},{"artist":"Willie Colón","title":"Siembra"},{"artist":"Daft Punk","title":"Discovery"},{"artist":"Los Prisioneros","title":"Pateando piedras"},{"artist":"Álvaro Díaz","title":"TE VI EN MIS PESADILLAS"},{"artist":"KAROL G","title":"ME TENGO QUE IR"},{"artist":"Willie Colon","title":"Siembra"},{"artist":"Pink Floyd","title":"The Dark Side of the Moon"},{"artist":"Daddy Yankee","title":"Gasolina"},{"artist":"Buena Vista Social Club","title":"Buena Vista Social Club"},{"artist":"Def Leppard","title":"Hysteria"},{"artist":"Led Zeppelin","title":"Whole Lotta Love"},{"artist":"Nirvana","title":"Nevermind"},{"artist":"Kendrick Lamar","title":"good kid m.A.A.d city"},{"artist":"Ramones","title":"Ramones"},{"artist":"Bad Bunny","title":"YHLQMDLG"},{"artist":"Bad Bunny","title":"X100PRE"},{"artist":"Rosalia","title":"Motomami"},{"artist":"Babasonicos","title":"La Pregunta"},{"artist":"Missy Elliott","title":"Get Ur Freak On"},{"artist":"Beyonce","title":"Lemonade"},{"artist":"Cafe Tacvba","title":"Re"},{"artist":"Cafe Tacvba","title":"Re"},{"artist":"Bad Bunny","title":"Debi Tirar Mas Fotos"},{"artist":"Alvaro Diaz","title":"Sayonara"},{"artist":"Bad Bunny","title":"Un Verano sin Ti"},{"artist":"Rauw Alejandro","title":"Vice Versa"},{"artist":"C. Tangana","title":"El Madrileño"},{"artist":"Carlos Vives","title":"La Tierra del Olvido"},{"artist":"La Pestilencia","title":"Balistica"},{"artist":"Aterciopelados","title":"El Dorado"},{"artist":"Carlos Vives","title":"Clasicos de la Provincia"},{"artist":"Ritchie Valens","title":"La Bamba"},{"artist":"Molotov","title":"Gimme tha Power"},{"artist":"Cardi B","title":"I Like It"},{"artist":"Luis Fonsi","title":"Despacito"},{"artist":"The Beatles","title":"Sgt Peppers Lonely Hearts Club Band"},{"artist":"Michael Jackson","title":"Thriller"},{"artist":"Historia","title":"1877-1959"},{"artist":"Historia","title":"1960s"},{"artist":"Historia","title":"1970s"},{"artist":"Historia","title":"1980s"},{"artist":"Historia","title":"1990s"},{"artist":"Historia","title":"2000s"},{"artist":"Historia","title":"2010s"},{"artist":"Historia","title":"2020s"}];
var CACHE_KEY = 'coi_collage_cache_v1';

var grid = document.getElementById('grid');
var statusTxt = document.getElementById('statusTxt');
var dlBtn = document.getElementById('dlBtn');
var loaded = 0, failed = 0;
var results = new Array(ALBUMS.length).fill(null);

var cache = {};
try{ cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }catch(e){}

ALBUMS.forEach(function(a, i){
  var tile = document.createElement('div');
  tile.className = 'tile';
  grid.appendChild(tile);
});

function upgradeArt(url){
  return url ? url.replace(/\d+x\d+bb\.jpg$/, '400x400bb.jpg') : null;
}

function fetchCover(a){
  var key = a.artist + '|||' + a.title;
  if(cache[key] !== undefined) return Promise.resolve(cache[key]);
  var term = encodeURIComponent(a.artist + ' ' + a.title);
  var url = 'https://itunes.apple.com/search?term=' + term + '&media=music&entity=album&limit=1';
  return fetch(url).then(function(r){ return r.json(); }).then(function(data){
    if(data.results && data.results.length){
      return upgradeArt(data.results[0].artworkUrl100);
    }
    var url2 = 'https://itunes.apple.com/search?term=' + term + '&media=music&limit=1';
    return fetch(url2).then(function(r){return r.json();}).then(function(d2){
      if(d2.results && d2.results.length) return upgradeArt(d2.results[0].artworkUrl100);
      return null;
    });
  }).catch(function(){ return null; }).then(function(art){
    cache[key] = art;
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); }catch(e){}
    return art;
  });
}

function finish(){
  statusTxt.textContent = loaded + ' de ' + ALBUMS.length + ' portadas listas';
  dlBtn.disabled = false;
}

var CONCURRENCY = 8;
var idx = 0;
function next(){
  if(idx >= ALBUMS.length){
    if(loaded+failed >= ALBUMS.length) finish();
    return;
  }
  var i = idx++;
  var a = ALBUMS[i];
  var tile = grid.children[i];
  fetchCover(a).then(function(artUrl){
    results[i] = artUrl;
    if(artUrl){
      var img = document.createElement('img');
      img.alt = a.artist + ' - ' + a.title;
      img.onload = function(){ img.classList.add('loaded'); };
      img.onerror = function(){
        failed++;
        tile.innerHTML = '<div class="fallback">'+a.artist+'</div>';
      };
      img.src = artUrl;
      tile.appendChild(img);
      loaded++;
    } else {
      failed++;
      tile.innerHTML = '<div class="fallback">'+a.artist+'</div>';
    }
    if(loaded+failed >= ALBUMS.length) finish();
    next();
  });
}
for(var c=0;c<CONCURRENCY;c++) next();

dlBtn.addEventListener('click', function(){
  var cols = 16, tileSize = 160;
  var rows = Math.ceil(ALBUMS.length/cols);
  var canvas = document.createElement('canvas');
  canvas.width = cols*tileSize;
  canvas.height = rows*tileSize;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#15121f';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  var imgs = grid.querySelectorAll('img.loaded');
  var pending = imgs.length;
  if(pending === 0){ alert('Todavía no hay portadas cargadas.'); return; }

  imgs.forEach(function(img){
    var tile = img.parentElement;
    var i = Array.prototype.indexOf.call(grid.children, tile);
    var col = i % cols, row = Math.floor(i/cols);
    try{
      ctx.drawImage(img, col*tileSize, row*tileSize, tileSize, tileSize);
    }catch(e){}
    pending--;
    if(pending === 0) doExport();
  });

  function doExport(){
    try{
      canvas.toBlob(function(blob){
        if(!blob){
          alert('El navegador bloqueó la exportación por seguridad (CORS). Toma una captura de pantalla de la cuadrícula en su lugar.');
          return;
        }
        saveBlob(blob);
      }, 'image/png');
    }catch(e){
      alert('El navegador bloqueó la exportación por seguridad (las portadas vienen de Apple y no siempre se pueden "leer" dentro de un canvas). Toma una captura de pantalla de la cuadrícula en su lugar — con eso también sirve.');
    }
  }

  function saveBlob(blob){
      if(window.claude && window.claude.use){
        window.claude.use('downloads').then(function(downloads){
          if(!downloads){
            alert('La descarga no está disponible aquí. Toma una captura de pantalla de la cuadrícula en su lugar.');
            return;
          }
          downloads.save({filename:'coleccionista-collage.png', data: blob}).catch(function(){
            alert('No se pudo guardar el archivo (puede que lo hayas rechazado).');
          });
        });
      } else {
        alert('La descarga no está disponible aquí. Toma una captura de pantalla de la cuadrícula en su lugar.');
      }
  }
});
</script>
